name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI List Command
      run: |
        antigravity-skills-move --list

    - name: Test Export Bundle
      run: |
        antigravity-skills-move --export test_bundle.zip

    - name: Test Add Skill
      run: |
        antigravity-skills-move --add-skill "Sample Test Skill" --description "A sample skill for testing"
