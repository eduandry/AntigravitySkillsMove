[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-skills-move"
version = "1.0.0"
description = "Seamlessly transport, backup, scaffold, and sync custom skills, plugins, and rules across multiple computers for Google Antigravity."
readme = "README.md"
authors = [
    { name = "Antigravity Community" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["antigravity", "gemini", "ai-skills", "sync", "automation", "developer-tools", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AntigravityCommunity/AntigravitySkillsMove"
Repository = "https://github.com/AntigravityCommunity/AntigravitySkillsMove.git"
Issues = "https://github.com/AntigravityCommunity/AntigravitySkillsMove/issues"

[project.scripts]
antigravity-skills-move = "antigravity_skills_move.cli:main"
skills-move = "antigravity_skills_move.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["antigravity_skills_move*"]
